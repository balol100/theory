<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg-main:#f8fafc;
--bg-card:#ffffff;
--bg-card-hover:#faf5ff;
--primary:#7c3aed;
--primary-dark:#6d28d9;
--primary-light:#ede9fe;
--primary-gradient:linear-gradient(135deg,#7c3aed,#a855f7);
--green:#22c55e;
--green-light:#dcfce7;
--red:#ef4444;
--red-light:#fef2f2;
--amber:#f59e0b;
--amber-light:#fef3c7;
--blue:#3b82f6;
--pink:#ec4899;
--text-primary:#1e293b;
--text-secondary:#64748b;
--text-muted:#94a3b8;
--border:#e2e8f0;
--shadow:0 4px 24px rgba(0,0,0,0.08);
--shadow-sm:0 1px 3px rgba(0,0,0,0.06);
--radius:16px;
--radius-sm:12px;
--radius-xs:8px;
--nav-height:72px;
--header-height:56px;
}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:var(--bg-main);
color:var(--text-primary);
min-height:100vh;min-height:100dvh;
overflow-x:hidden;
-webkit-font-smoothing:antialiased;
}
html[dir="ltr"] body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Loading Screen */
#loading-screen{
position:fixed;top:0;left:0;right:0;bottom:0;
background:var(--bg-main);
display:flex;flex-direction:column;align-items:center;justify-content:center;
z-index:10000;transition:opacity .5s ease,visibility .5s ease;
}
#loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-road{width:280px;height:4px;background:var(--border);border-radius:2px;position:relative;overflow:hidden;margin-bottom:32px}
.loading-road::after{content:'';position:absolute;top:0;left:0;height:100%;width:40%;background:var(--primary-gradient);border-radius:2px;animation:roadPulse 1.5s ease-in-out infinite}
@keyframes roadPulse{0%{left:-40%;width:40%}50%{width:60%}100%{left:100%;width:40%}}
.loading-car{font-size:48px;animation:carBounce 1s ease-in-out infinite;margin-bottom:16px}
@keyframes carBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.loading-text{color:var(--text-secondary);font-size:15px;margin-top:8px}
.loading-title{font-size:24px;font-weight:800;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.loading-error{color:var(--red);margin-top:16px;text-align:center;max-width:300px;font-size:14px}
.loading-retry{margin-top:12px;padding:10px 28px;border-radius:var(--radius-sm);background:var(--primary-gradient);color:#fff;font-weight:600;font-size:15px}

/* App Layout */
#app{display:none;min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--nav-height) + 8px)}
#app.visible{display:block}
#app-header{
position:sticky;top:0;z-index:100;
background:rgba(248,250,252,0.92);
-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
height:var(--header-height);
display:flex;align-items:center;justify-content:space-between;
padding:0 16px;border-bottom:1px solid var(--border);
}
.header-title{font-size:17px;font-weight:700}
.header-back{background:none;color:var(--text-primary);font-size:14px;display:flex;align-items:center;gap:6px;padding:8px 4px}
.header-right{display:flex;align-items:center;gap:8px}
.lang-toggle{background:var(--bg-card);color:var(--text-primary);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid var(--border);transition:background .2s}
.lang-toggle:hover{background:var(--bg-card-hover)}

#app-content{
min-height:calc(100vh - var(--header-height) - var(--nav-height));
min-height:calc(100dvh - var(--header-height) - var(--nav-height));
padding:16px;animation:pageIn .3s ease;
}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Bottom Nav */
#app-nav{
position:fixed;bottom:0;left:0;right:0;
height:var(--nav-height);
background:rgba(255,255,255,0.95);
-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
border-top:1px solid var(--border);
display:flex;align-items:center;justify-content:space-around;
z-index:100;padding-bottom:env(safe-area-inset-bottom,0);
}
.nav-btn{
background:none;color:var(--text-muted);
display:flex;flex-direction:column;align-items:center;gap:3px;
padding:6px 12px;border-radius:var(--radius-sm);
transition:color .2s;font-size:10px;font-weight:600;min-width:56px;position:relative;
}
.nav-btn .nav-icon{font-size:22px;line-height:1}
.nav-btn.active{color:var(--primary)}
.nav-btn.active .nav-icon{transform:scale(1.1)}
.nav-btn-raised{position:relative;margin-top:-18px}
.nav-btn-raised .nav-icon-circle{
width:52px;height:52px;border-radius:50%;
background:var(--primary-gradient);
display:flex;align-items:center;justify-content:center;
box-shadow:0 4px 16px rgba(124,58,237,0.35);
color:#fff;font-size:24px;
}
.nav-btn-raised span.nav-label{margin-top:2px}
.nav-btn-raised.active .nav-icon-circle{box-shadow:0 4px 20px rgba(124,58,237,0.5)}

/* Cards */
.card{
background:var(--bg-card);border-radius:var(--radius);
border:1px solid var(--border);padding:20px;
transition:transform .2s,box-shadow .2s;
box-shadow:var(--shadow-sm);
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card-glow{border:1px solid rgba(124,58,237,0.3);box-shadow:0 0 20px rgba(124,58,237,0.08)}

/* Buttons */
.btn{
display:inline-flex;align-items:center;justify-content:center;gap:8px;
padding:14px 28px;border-radius:var(--radius-sm);
font-weight:700;font-size:16px;
transition:transform .15s,opacity .15s,box-shadow .15s;min-height:48px;
}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--primary-gradient);color:#fff;box-shadow:0 4px 16px rgba(124,58,237,0.3)}
.btn-primary:hover{box-shadow:0 6px 24px rgba(124,58,237,0.4)}
.btn-secondary{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-card-hover)}
.btn-danger{background:var(--red);color:#fff}
.btn-block{display:flex;width:100%}
.btn-sm{padding:10px 20px;font-size:14px;min-height:40px}

/* Gradient Text */
.gradient-text{background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Progress Bar */
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:var(--primary-gradient);transition:width .8s cubic-bezier(0.4,0,0.2,1)}
.progress-bar-lg{height:12px;border-radius:6px}
.progress-bar-lg .progress-fill{border-radius:6px}

/* Answer Buttons */
.answer-btn{
display:flex;align-items:center;gap:12px;width:100%;padding:16px;margin-bottom:10px;
background:var(--bg-card);border:2px solid var(--border);
border-radius:var(--radius-sm);color:var(--text-primary);
font-size:15px;font-weight:500;text-align:start;
transition:border-color .2s,background .2s,transform .15s;min-height:52px;line-height:1.45;cursor:pointer;
}
.answer-btn:hover:not(.disabled){border-color:var(--primary);background:var(--bg-card-hover)}
.answer-btn:active:not(.disabled){transform:scale(0.98)}
.answer-btn .answer-letter{
width:32px;height:32px;border-radius:50%;
background:var(--primary-light);color:var(--primary);
display:flex;align-items:center;justify-content:center;
font-weight:700;font-size:14px;flex-shrink:0;transition:background .2s,color .2s;
}
.answer-btn.correct{border-color:var(--green);background:var(--green-light)}
.answer-btn.correct .answer-letter{background:var(--green);color:#fff}
.answer-btn.wrong{border-color:var(--red);background:var(--red-light)}
.answer-btn.wrong .answer-letter{background:var(--red);color:#fff}
.answer-btn.selected{border-color:var(--primary);background:var(--primary-light)}
.answer-btn.selected .answer-letter{background:var(--primary);color:#fff}
.answer-btn.disabled{pointer-events:none;opacity:0.85}

/* Category Chips */
.category-chip{
display:inline-flex;align-items:center;gap:6px;
padding:10px 18px;border-radius:24px;
background:var(--bg-card);border:2px solid var(--border);
color:var(--text-secondary);font-size:14px;font-weight:600;
transition:all .2s;cursor:pointer;
}
.category-chip:hover{border-color:var(--primary)}
.category-chip.active{border-color:var(--primary);color:#fff;background:var(--primary)}
.category-chip .chip-count{font-size:12px;opacity:0.7;background:rgba(0,0,0,0.06);padding:2px 8px;border-radius:10px}
.category-chip.active .chip-count{background:rgba(255,255,255,0.25)}

/* License pills */
.license-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.license-pill{
padding:10px 16px;border-radius:24px;font-size:13px;font-weight:600;
border:2px solid var(--primary);color:var(--primary);background:var(--bg-card);
transition:all .2s;cursor:pointer;display:flex;align-items:center;gap:6px;
}
.license-pill.active{background:var(--primary);color:#fff}

/* Stats Bars */
.stat-bar{margin-bottom:14px}
.stat-bar-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px}
.stat-bar-label{color:var(--text-secondary);font-weight:500}
.stat-bar-value{color:var(--text-primary);font-weight:700}

/* Badge */
.badge{
display:inline-flex;flex-direction:column;align-items:center;gap:6px;
padding:14px;border-radius:var(--radius-sm);
background:var(--bg-card);border:1px solid var(--border);
width:90px;text-align:center;transition:all .3s;box-shadow:var(--shadow-sm);
}
.badge.earned{border-color:rgba(245,158,11,0.4);box-shadow:0 0 16px rgba(245,158,11,0.15)}
.badge.locked{opacity:0.4;filter:grayscale(1)}
.badge-icon{font-size:28px}
.badge-name{font-size:11px;color:var(--text-secondary);font-weight:600;line-height:1.3}

/* XP Float */
.xp-float{
position:fixed;z-index:9999;font-size:18px;font-weight:800;
color:var(--primary);pointer-events:none;
animation:xpFloatUp 1.2s ease-out forwards;
text-shadow:0 0 10px rgba(124,58,237,0.4);
}
@keyframes xpFloatUp{0%{opacity:1;transform:translateY(0) scale(1)}60%{opacity:1;transform:translateY(-40px) scale(1.2)}100%{opacity:0;transform:translateY(-70px) scale(0.8)}}

/* Confetti */
#confetti-container{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9998;overflow:hidden}
.confetti-piece{position:absolute;top:-20px;opacity:0;animation:confettiFall 3.5s ease-in forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotateZ(0deg) rotateX(0deg)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(100vh) rotateZ(720deg) rotateX(360deg)}}

/* Timer */
.exam-timer{
display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;
background:var(--bg-card);border:1px solid var(--border);
font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
}
.exam-timer.warning{color:var(--amber);border-color:rgba(245,158,11,0.4)}
.exam-timer.danger{color:var(--red);border-color:rgba(239,68,68,0.4);animation:timerPulse 1s infinite}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:0.5}}

/* Streak banner */
.streak-banner{
display:flex;align-items:center;gap:8px;
padding:10px 16px;border-radius:var(--radius-sm);
background:var(--amber-light);border:1px solid rgba(245,158,11,0.3);
font-size:14px;font-weight:600;color:#92400e;margin-bottom:16px;
animation:streakIn .3s ease;
}
@keyframes streakIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}

/* Fire pulse */
@keyframes firePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.fire-pulse{display:inline-block;animation:firePulse 1.5s ease-in-out infinite}

/* Hero / Home sections */
.hero-stats-row{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.hero-stat-badge{
background:var(--bg-card);border-radius:var(--radius-sm);padding:12px 16px;
border:1px solid var(--border);box-shadow:var(--shadow-sm);
display:flex;align-items:center;gap:8px;flex:1;min-width:0;
}
.hero-stat-badge .stat-emoji{font-size:20px;flex-shrink:0}
.hero-stat-badge .stat-info{display:flex;flex-direction:column}
.hero-stat-badge .stat-val{font-size:16px;font-weight:800}
.hero-stat-badge .stat-lbl{font-size:10px;color:var(--text-muted);font-weight:500}

/* Action cards grid */
.action-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.action-card{
background:var(--bg-card);border-radius:var(--radius);padding:20px 16px;
border:1px solid var(--border);box-shadow:var(--shadow-sm);
cursor:pointer;text-align:center;transition:transform .2s,box-shadow .2s;
}
.action-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.action-card .ac-icon{font-size:32px;margin-bottom:8px}
.action-card .ac-title{font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text-primary)}
.action-card .ac-desc{font-size:12px;color:var(--text-secondary);line-height:1.4}

/* Readiness meter */
.readiness-card{
background:var(--bg-card);border-radius:var(--radius);padding:24px;
border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:20px;text-align:center;
}
.readiness-pct{font-size:48px;font-weight:900;line-height:1}
.readiness-bar{height:12px;border-radius:6px;background:var(--border);overflow:hidden;margin:12px 0}
.readiness-bar .fill{height:100%;border-radius:6px;transition:width .8s cubic-bezier(0.4,0,0.2,1)}

/* Daily mission */
.daily-mission{
background:var(--bg-card);border-radius:var(--radius);padding:20px;
border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:20px;
display:flex;align-items:center;gap:16px;
}
.mission-circle{
width:64px;height:64px;border-radius:50%;position:relative;flex-shrink:0;
display:flex;align-items:center;justify-content:center;
}
.mission-circle svg{transform:rotate(-90deg)}
.mission-circle .mission-text{position:absolute;font-size:12px;font-weight:700;color:var(--text-primary)}
.mission-info{flex:1}
.mission-title{font-size:15px;font-weight:700;margin-bottom:4px}
.mission-desc{font-size:13px;color:var(--text-secondary)}

/* Learning path */
.learning-path{margin-bottom:20px}
.path-node{
display:flex;align-items:center;gap:14px;padding:14px 16px;
background:var(--bg-card);border:1px solid var(--border);
border-radius:var(--radius-sm);margin-bottom:0;position:relative;
cursor:pointer;transition:background .2s;box-shadow:var(--shadow-sm);
}
.path-node:hover:not(.path-locked){background:var(--bg-card-hover)}
.path-node.path-locked{opacity:0.5;cursor:default}
.path-node .path-icon{font-size:24px;flex-shrink:0;width:32px;text-align:center}
.path-node .path-info{flex:1}
.path-node .path-name{font-size:14px;font-weight:600}
.path-node .path-pct{font-size:12px;color:var(--text-muted)}
.path-connector{width:2px;height:20px;background:var(--border);margin:0 0 0 30px}
.path-node.path-completed{border-color:var(--green)}
.path-node.path-active{border-color:var(--primary);border-width:2px}

/* Gamification / next level */
.level-card{
background:var(--bg-card);border-radius:var(--radius);padding:20px;
border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:20px;
}

/* Marketing tagline */
.tagline-section{
text-align:center;padding:32px 16px;margin-bottom:20px;
background:linear-gradient(135deg,var(--primary-light),#fce7f3);
border-radius:var(--radius);
}
.tagline-main{font-size:20px;font-weight:800;color:var(--text-primary);margin-bottom:8px}
.tagline-sub{font-size:14px;color:var(--text-secondary);line-height:1.6}

/* ARIA tip */
.aria-tip{
margin-top:16px;padding:16px;border-radius:var(--radius-sm);
background:linear-gradient(135deg,var(--primary-light),#fdf4ff);
border:1px solid rgba(124,58,237,0.2);
}
.aria-header{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.aria-text{font-size:13px;color:var(--text-secondary);line-height:1.6}

/* FAQ */
.faq-section{text-align:start;margin-bottom:20px}
.faq-title{font-size:20px;font-weight:700;margin-bottom:16px}
.faq-item{background:var(--bg-card);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow-sm)}
.faq-question{
padding:16px;font-weight:600;font-size:15px;cursor:pointer;
display:flex;justify-content:space-between;align-items:center;gap:12px;
background:none;color:var(--text-primary);width:100%;text-align:start;
}
.faq-question::after{content:'';width:8px;height:8px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);transform:rotate(45deg);transition:transform .3s;flex-shrink:0}
.faq-item.open .faq-question::after{transform:rotate(-135deg)}
.faq-answer{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease;font-size:14px;color:var(--text-secondary);line-height:1.6;padding:0 16px}
.faq-item.open .faq-answer{max-height:200px;padding:0 16px 16px}

/* Analysis */
.analysis-section{margin-bottom:24px}
.analysis-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.analysis-card{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.analysis-tip{
padding:16px;border-radius:var(--radius-sm);
background:linear-gradient(135deg,rgba(124,58,237,0.08),rgba(168,85,247,0.08));
border:1px solid rgba(124,58,237,0.2);font-size:14px;line-height:1.6;
}

/* Session History */
.session-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.session-item:last-child{border-bottom:none}
.session-info{flex:1}
.session-type{font-size:13px;color:var(--text-muted);font-weight:500}
.session-date{font-size:12px;color:var(--text-muted);margin-top:2px}
.session-score{font-size:18px;font-weight:800;padding:4px 12px;border-radius:var(--radius-xs)}
.session-score.pass{color:var(--green);background:var(--green-light)}
.session-score.fail{color:var(--red);background:var(--red-light)}

/* Settings */
.settings-group{margin-bottom:24px}
.settings-group-title{font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;margin-bottom:10px;letter-spacing:0.5px}
.settings-item{
display:flex;align-items:center;justify-content:space-between;
padding:16px;background:var(--bg-card);border:1px solid var(--border);
cursor:pointer;transition:background .2s;
}
.settings-item:hover{background:var(--bg-card-hover)}
.settings-item:first-child{border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.settings-item:last-child{border-radius:0 0 var(--radius-sm) var(--radius-sm)}
.settings-item+.settings-item{border-top:none}
.settings-item-only{border-radius:var(--radius-sm)}
.settings-label{font-size:15px;font-weight:500;display:flex;align-items:center;gap:10px}
.settings-arrow{color:var(--text-muted);font-size:18px}
.settings-value{color:var(--text-muted);font-size:14px}

/* Legal Pages */
.legal-page{max-width:640px;margin:0 auto}
.legal-page h2{font-size:22px;font-weight:700;margin-bottom:16px;color:var(--text-primary)}
.legal-page h3{font-size:17px;font-weight:600;margin:20px 0 10px;color:var(--primary)}
.legal-page p{font-size:14px;line-height:1.7;color:var(--text-secondary);margin-bottom:12px}
.legal-page ul{padding-inline-start:20px;margin-bottom:12px}
.legal-page li{font-size:14px;line-height:1.7;color:var(--text-secondary);margin-bottom:4px}

/* Footer */
.app-footer{
text-align:center;padding:20px 16px;
font-size:12px;color:var(--text-muted);line-height:1.6;
border-top:1px solid var(--border);margin-top:24px;
}
.app-footer img{width:20px;height:20px;vertical-align:middle;margin:0 4px}

/* Modal */
.modal-overlay{
position:fixed;top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.4);z-index:1000;
display:flex;align-items:center;justify-content:center;
padding:16px;animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);padding:28px;max-width:360px;width:100%;animation:modalIn .3s ease;box-shadow:var(--shadow)}
@keyframes modalIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
.modal h3{font-size:18px;font-weight:700;margin-bottom:12px}
.modal p{font-size:14px;color:var(--text-secondary);margin-bottom:20px;line-height:1.5}
.modal-buttons{display:flex;gap:10px}
.modal-buttons .btn{flex:1}

/* Exam Result */
.result-circle{
width:160px;height:160px;border-radius:50%;margin:0 auto 24px;
display:flex;flex-direction:column;align-items:center;justify-content:center;
border:4px solid;position:relative;background:var(--bg-card);
}
.result-circle.pass{border-color:var(--green);box-shadow:0 0 40px rgba(34,197,94,0.2)}
.result-circle.fail{border-color:var(--red);box-shadow:0 0 40px rgba(239,68,68,0.2)}
.result-score{font-size:42px;font-weight:800}
.result-label{font-size:14px;color:var(--text-secondary);font-weight:500}

/* Question Category Badge */
.q-category{
display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:14px;
background:var(--primary-light);border:1px solid rgba(124,58,237,0.25);
font-size:12px;font-weight:600;color:var(--primary);margin-bottom:14px;
}
.q-counter{font-size:13px;color:var(--text-muted);font-weight:500;margin-bottom:8px}

/* Level Badge */
.level-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:14px;font-size:13px;font-weight:700}
.level-beginner{background:rgba(148,163,184,0.15);color:var(--text-secondary)}
.level-intermediate{background:rgba(59,130,246,0.12);color:var(--blue)}
.level-advanced{background:rgba(124,58,237,0.12);color:var(--primary)}
.level-expert{background:rgba(245,158,11,0.12);color:var(--amber)}

/* Challenge card */
.challenge-card{
background:var(--bg-card);border-radius:var(--radius);padding:20px;
border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:16px;
}
.challenge-card .cc-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.challenge-card .cc-icon{font-size:28px}
.challenge-card .cc-title{font-size:16px;font-weight:700}
.challenge-card .cc-desc{font-size:13px;color:var(--text-secondary);margin-bottom:12px;line-height:1.5}
.btn-whatsapp{background:#25D366;color:#fff;border-radius:var(--radius-sm);padding:12px 20px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;width:100%;justify-content:center}
.btn-whatsapp:hover{background:#1da851}

/* Streak vis */
.streak-vis{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.streak-day{
width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
font-size:10px;font-weight:600;
}
.streak-day.active{background:var(--green-light);color:var(--green)}
.streak-day.inactive{background:var(--border);color:var(--text-muted)}
.streak-day.today{border:2px solid var(--primary)}

/* Profile license cards */
.profile-license-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.profile-license-card{
background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);
padding:20px;text-align:center;cursor:pointer;transition:all .2s;
}
.profile-license-card.active{border-color:var(--primary);background:var(--primary-light)}
.profile-license-card .plc-icon{font-size:32px;margin-bottom:6px}
.profile-license-card .plc-name{font-size:14px;font-weight:700}
.profile-license-card .plc-type{font-size:12px;color:var(--text-muted)}

/* Toast notification */
.toast{
position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
background:var(--bg-card);border:1px solid var(--border);
border-radius:var(--radius-sm);padding:14px 24px;
z-index:10001;font-size:14px;font-weight:600;
box-shadow:var(--shadow);
transition:transform .4s cubic-bezier(0.34,1.56,0.64,1);
display:flex;align-items:center;gap:10px;
}
.toast.visible{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(34,197,94,0.4)}
.toast.error{border-color:rgba(239,68,68,0.4)}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Badge pulse */
@keyframes badgePulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,0.4)}70%{box-shadow:0 0 0 10px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.badge.just-earned{animation:badgePulse 1s ease 3}

/* Responsive */
@media(min-width:640px){
#app-content{max-width:560px;margin:0 auto;padding:24px}
.action-cards{gap:16px}
}

/* LTR overrides */
html[dir="ltr"] .faq-question::after{transform:rotate(45deg)}
html[dir="ltr"] .faq-item.open .faq-question::after{transform:rotate(-135deg)}

html,body{height:100%}

.study-hero .subtitle{color:var(--text-secondary);font-size:.95rem}
.study-source{display:inline-block;font-size:.78rem;color:var(--text-secondary);background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:6px 14px;margin-top:10px}
.study-source a{color:var(--primary)}
.study-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 24px}

.study-nav-btn:hover,.study-nav-btn.active{color:var(--primary);background:var(--primary-light);border-color:rgba(124,58,237,.3)}
.study-section{margin-bottom:16px}

.study-section-header:hover{border-color:rgba(124,58,237,.3);background:var(--bg-card-hover)}
.study-section-header.open{border-radius:16px 16px 0 0;border-bottom-color:transparent;background:var(--primary-light)}
.study-section-icon{font-size:1.5rem;flex-shrink:0}
.study-section-title{flex:1;font-size:1.1rem;font-weight:800;color:var(--text-primary)}
.study-section-arrow{font-size:.8rem;color:var(--text-secondary);transition:transform .3s}
.study-section-header.open .study-section-arrow{transform:rotate(180deg)}
.study-section-body{display:none;padding:20px 22px;background:var(--bg-card);border:1px solid var(--border);border-top:none;border-radius:0 0 16px 16px}
.study-section-body.open{display:block;animation:studyFadeIn .3s}
@keyframes studyFadeIn{from{opacity:0}to{opacity:1}}
.study-topic{margin-bottom:20px}
.study-topic:last-child{margin-bottom:0}
.study-topic h4{font-size:1rem;font-weight:800;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.study-topic h4::before{content:'';width:3px;height:16px;background:linear-gradient(180deg,var(--primary),#a855f7);border-radius:2px;flex-shrink:0}
.study-topic p,.study-topic li{font-size:.9rem;color:var(--text-primary);line-height:1.7;margin-bottom:6px}
.study-topic ul{list-style:none;padding:0}
.study-topic li{padding-right:18px;position:relative}
.study-topic li::before{content:'\25C6';position:absolute;right:0;color:var(--primary);font-size:.55rem;top:6px}
.study-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.85rem}
.study-table th{background:var(--primary-light);color:var(--primary);padding:10px 12px;text-align:right;font-weight:700;border:1px solid var(--border)}
.study-table td{padding:9px 12px;border:1px solid var(--border);color:var(--text-primary)}
.study-table tr:nth-child(even) td{background:var(--bg-main)}
.study-highlight{background:var(--primary-light);border:1px solid rgba(124,58,237,.2);border-radius:12px;padding:14px 16px;margin:12px 0;font-size:.88rem;line-height:1.6;color:var(--text-primary)}
.study-highlight strong{color:var(--primary)}
.study-link-practice{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:8px 16px;background:var(--primary-gradient);color:#fff;border-radius:10px;font-size:.82rem;font-weight:700;text-decoration:none;cursor:pointer;border:none;font-family:inherit;transition:transform .15s,box-shadow .25s}
.study-link-practice:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(124,58,237,.35)}
@media(max-width:600px){
  .study-section-header{padding:14px 16px;gap:10px}
  .study-section-title{font-size:.95rem}
  .study-section-body{padding:16px}

}

/* ============================================================
   UTILITY FUNCTIONS
   ============================================================ */
function t(key) { var d=T[lang]; if(d&&d[key]) return d[key]; var f=T['he']; return (f&&f[key])||key; }

function loadStats() {
  try { var r=localStorage.getItem(STORAGE_KEYS.stats); if(r) stats=JSON.parse(r); } catch(e){}
  if(!stats) stats={totalAnswered:0,totalCorrect:0,currentStreak:0,bestStreak:0,xp:0,categoryStats:{},sessions:[],badges:[]};
  if(!stats.categoryStats) stats.categoryStats={};
  if(!stats.sessions) stats.sessions=[];
  if(!stats.badges) stats.badges=[];
}
function saveStats() { try{localStorage.setItem(STORAGE_KEYS.stats,JSON.stringify(stats))}catch(e){} }
function resetStats() {
  stats={totalAnswered:0,totalCorrect:0,currentStreak:0,bestStreak:0,xp:0,categoryStats:{},sessions:[],badges:[]};
  saveStats(); closeModal();
  showToast(lang==='he'?'הנתונים אופסו':'Data reset','success');
  navigate(currentPage);
}
function getLevel() { var xp=stats?stats.xp:0; for(var i=0;i<LEVELS.length;i++){if(xp>=LEVELS[i].min&&xp<=LEVELS[i].max) return LEVELS[i];} return LEVELS[LEVELS.length-1]; }
function getLevelProgress() { var lv=getLevel(),xp=stats?stats.xp:0,range=lv.max-lv.min+1,prog=xp-lv.min; return Math.min(100,Math.round((prog/range)*100)); }
function getXPToNextLevel() { var lv=getLevel(),xp=stats?stats.xp:0; return (lv.max+1)-xp; }
function getNextLevelKey() { var lv=getLevel(); for(var i=0;i<LEVELS.length;i++){if(LEVELS[i].key===lv.key && i<LEVELS.length-1) return LEVELS[i+1].key;} return lv.key; }
function getAccuracy() { if(!stats||stats.totalAnswered===0) return 0; return Math.round((stats.totalCorrect/stats.totalAnswered)*100); }
function getCategoryAccuracy(catName) { if(!stats||!stats.categoryStats||!stats.categoryStats[catName]) return null; var c=stats.categoryStats[catName]; if(c.answered===0) return null; return Math.round((c.correct/c.answered)*100); }
function shuffle(arr) { var a=arr.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;} return a; }
function formatTime(s) { var m=Math.floor(s/60),sec=s%60; return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec; }
function hasBadge(id) { return stats&&stats.badges&&stats.badges.indexOf(id)!==-1; }
function awardBadge(id) { if(hasBadge(id)) return false; stats.badges.push(id); saveStats(); var badge=null; for(var i=0;i<BADGES.length;i++){if(BADGES[i].id===id){badge=BADGES[i];break;}} if(badge) showToast(badge.icon+' '+t(badge.key)+'!','success'); return true; }
function checkBadges() {
  if(stats.totalAnswered>=1) awardBadge('first');
  if(stats.currentStreak>=10) awardBadge('streak10');
  if(stats.totalAnswered>=100) awardBadge('hundred');
  var ck=Object.keys(stats.categoryStats);
  for(var i=0;i<ck.length;i++){var c=stats.categoryStats[ck[i]];if(c.answered>=20&&(c.correct/c.answered)>=0.9){awardBadge('master');break;}}
}
function getCategoryEnglish(he) { for(var i=0;i<CATEGORIES.length;i++){if(CATEGORIES[i].he===he) return CATEGORIES[i].en;} return he; }
function getCategoryDisplayName(he) { return lang==='en'?getCategoryEnglish(he):he; }
function getCategoryTipKey(he) { for(var i=0;i<CATEGORIES.length;i++){if(CATEGORIES[i].he===he) return CATEGORIES[i].tip;} return 'general_tip'; }

/* Daily mission */
function getTodayKey() { return new Date().toISOString().slice(0,10); }
function getDailyCorrect() { try{var d=JSON.parse(localStorage.getItem(STORAGE_KEYS.daily)||'{}'); return d[getTodayKey()]||0;}catch(e){return 0;} }
function addDailyCorrect(n) { try{var d=JSON.parse(localStorage.getItem(STORAGE_KEYS.daily)||'{}'); var k=getTodayKey(); d[k]=(d[k]||0)+n; localStorage.setItem(STORAGE_KEYS.daily,JSON.stringify(d));}catch(e){} }

/* Streak days */
function getStreakDays() {
  try{var arr=JSON.parse(localStorage.getItem(STORAGE_KEYS.streakDays)||'[]'); return arr;}catch(e){return [];}
}
function recordStreakDay() {
  var arr=getStreakDays(); var today=getTodayKey();
  if(arr.indexOf(today)===-1){arr.push(today); if(arr.length>30) arr=arr.slice(-30); try{localStorage.setItem(STORAGE_KEYS.streakDays,JSON.stringify(arr));}catch(e){}}
}
function countConsecutiveDays() {
  var arr=getStreakDays(); if(arr.length===0) return 0;
  arr.sort(); var count=0; var d=new Date(); d.setHours(0,0,0,0);
  for(var i=0;i<60;i++){var k=d.toISOString().slice(0,10); if(arr.indexOf(k)!==-1){count++; d.setDate(d.getDate()-1);} else break;}
  return count;
}

/* Readiness score */
function getReadiness() {
  if(!stats||stats.totalAnswered===0) return 0;
  var accW = (stats.totalCorrect/stats.totalAnswered)*60;
  var coveredCats=0;
  for(var i=0;i<CATEGORIES.length;i++){var c=stats.categoryStats[CATEGORIES[i].he]; if(c&&c.answered>=5) coveredCats++;}
  var covW=(coveredCats/CATEGORIES.length)*40;
  return Math.min(100,Math.round(accW+covW));
}

var toastTimeout=null;

  setTimeout(function(){el.classList.add('visible')},10);
  toastTimeout=setTimeout(function(){el.classList.remove('visible')},2500);
}

}

function launchConfetti() {
  var c=document.getElementById('confetti-container');c.innerHTML='';
  for(var i=0;i<80;i++){
    var p=document.createElement('div');p.className='confetti-piece';
    var col=CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    var sz=Math.random()*8+5,lp=Math.random()*100,dl=Math.random()*2,dur=Math.random()*2+2.5;
    var shp=Math.random()>0.5?'50%':'0';
    p.style.left=lp+'%';p.style.width=sz+'px';p.style.height=sz+'px';
    p.style.backgroundColor=col;p.style.borderRadius=shp;
    p.style.animationDelay=dl+'s';p.style.animationDuration=dur+'s';
    c.appendChild(p);
  }
  setTimeout(function(){c.innerHTML=''},5000);
}

/* ============================================================
   MODAL
   ============================================================ */
function showModal(title,msg,confirmText,cancelText,onConfirm) {
  closeModal();
  var ov=document.createElement('div');ov.className='modal-overlay';ov.id='modal-overlay';
  var h='<div class="modal"><h3>'+title+'</h3><p>'+msg+'</p><div class="modal-buttons">';
  h+='<button class="btn btn-sm btn-danger" id="modal-confirm">'+confirmText+'</button>';
  h+='<button class="btn btn-sm btn-secondary" id="modal-cancel">'+cancelText+'</button>';
  h+='</div></div>';
  ov.innerHTML=h;document.body.appendChild(ov);
  document.getElementById('modal-confirm').onclick=onConfirm;
  document.getElementById('modal-cancel').onclick=closeModal;
  ov.onclick=function(e){if(e.target===ov) closeModal()};
}
function closeModal() { var el=document.getElementById('modal-overlay'); if(el&&el.parentNode) el.parentNode.removeChild(el); }

/* ============================================================
   DATA FETCHING
   ============================================================ */
function fetchQuestions() {
  var errEl=document.getElementById('loading-error'),retryEl=document.getElementById('loading-retry');
  errEl.style.display='none';retryEl.style.display='none';
  try{var cached=localStorage.getItem(STORAGE_KEYS.questions);if(cached){var parsed=JSON.parse(cached);if(parsed&&parsed.length>100){questions=parsed;onQuestionsReady();fetchFromAPI(true);return;}}}catch(e){}
  fetchFromAPI(false);
}
function fetchFromAPI(bg) {
  var errEl=document.getElementById('loading-error'),retryEl=document.getElementById('loading-retry');
  fetch(QUESTIONS_URL).then(function(r){if(!r.ok) throw new Error('HTTP '+r.status);return r.json()})
  .then(function(d){if(d&&d.length>0){questions=d;try{localStorage.setItem(STORAGE_KEYS.questions,JSON.stringify(d))}catch(e){}if(!bg) onQuestionsReady();}else if(!bg) throw new Error('Empty');})
  .catch(function(e){if(!bg&&questions.length===0){errEl.textContent=lang==='he'?'שגיאה בטעינת השאלות. בדוק את החיבור לאינטרנט.':'Error loading questions. Check your internet connection.';errEl.style.display='block';retryEl.style.display='inline-block';}});
}
function onQuestionsReady() {
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('app').classList.add('visible');
  navigate('home');
}

   ============================================================ */
function navigate(page) {
  if(currentPage==='exam-active'&&page!=='exam-active'){if(examTimer){clearInterval(examTimer);examTimer=null;}}
  currentPage=page;
  var content=document.getElementById('app-content');
  content.style.animation='none';void content.offsetHeight;content.style.animation='pageIn .3s ease';
  var navBtns=document.querySelectorAll('.nav-btn');
  for(var i=0;i<navBtns.length;i++){
    navBtns[i].classList.remove('active');
    var p=navBtns[i].getAttribute('data-page');
    if(p===page||(page==='practice-setup'&&p==='practice')||(page==='practice-active'&&p==='practice')
      ||(page==='exam-setup'&&p==='home')||(page==='exam-active'&&p==='home')
      ||(page==='exam-results'&&p==='home')||(page==='analysis'&&p==='practice')
      ||(page==='accessibility-page'&&p==='profile')||(page==='terms-page'&&p==='profile')
      ||(page==='privacy-page'&&p==='profile'))
      navBtns[i].classList.add('active');
  }
  updateHeader(page);
  switch(page){
    case 'home':renderHome();break;
    case 'practice':renderPracticeSetup();break;
    case 'practice-setup':renderPracticeSetup();break;
    case 'practice-active':renderPracticeQuestion();break;
    case 'exam-setup':renderExamSetup();break;
    case 'exam-active':renderExamQuestion();break;
    case 'exam-results':renderExamResults();break;
    case 'analysis':renderAnalysis();break;
    case 'stats':renderStats();break;
    case 'challenges':renderChallenges();break;
    case 'profile':renderProfile();break;
    case 'accessibility-page':renderAccessibility();break;
    case 'terms-page':renderTerms();break;
    case 'privacy-page':renderPrivacy();break;
    case 'study-guide':renderStudyGuide();break;
    default:renderHome();
  }
  window.scrollTo(0,0);
}

function updateHeader(page) {

function toggleCategory(cat) {
  if(cat==='all'){selectedCategories=['all'];}
  else{var ai=selectedCategories.indexOf('all');if(ai!==-1) selectedCategories.splice(ai,1);
  var idx=selectedCategories.indexOf(cat);if(idx!==-1) selectedCategories.splice(idx,1);else selectedCategories.push(cat);
  if(selectedCategories.length===0) selectedCategories=['all'];}
  renderPracticeSetup();
}

/* ============================================================
   PRACTICE MODE
   ============================================================ */
function startPractice() {
  var filtered;
  if(selectedCategories.indexOf('all')!==-1) filtered=questions.slice();
  else{filtered=[];for(var i=0;i<questions.length;i++){if(selectedCategories.indexOf(questions[i][4])!==-1) filtered.push(questions[i]);}}
  practiceQuestions=shuffle(filtered);
  practiceIndex=0;practiceAnswered=false;
  practiceSessionCorrect=0;practiceSessionTotal=0;practiceSessionAnswers=[];
  navigate('practice-active');
}

function renderPracticeQuestion() {
  currentPage='practice-active';
  if(practiceIndex>=practiceQuestions.length){practiceIndex=0;practiceQuestions=shuffle(practiceQuestions);}
  var q=practiceQuestions[practiceIndex];
  var content=document.getElementById('app-content');
  var total=practiceQuestions.length,num=practiceIndex+1;
  var letters=['A','B','C','D'];
  var html='';
  if(stats&&stats.currentStreak>=3) html+='<div class="streak-banner"><span class="fire-pulse">🔥</span> '+t('streak')+': '+stats.currentStreak+'</div>';
  html+='<div class="q-category">'+getCategoryDisplayName(q[4])+'</div>';
  html+='<div class="q-counter">'+t('question')+' '+num+' '+t('of')+' '+total+'</div>';
  html+='<div class="progress-bar" style="margin-bottom:16px"><div class="progress-fill" style="width:'+((num/total)*100)+'%"></div></div>';
  html+='<h3 style="font-size:17px;font-weight:600;line-height:1.6;margin-bottom:20px">'+q[1]+'</h3>';
  html+='<div id="answers-container">';
  for(var i=0;i<q[2].length;i++){
    html+='<button class="answer-btn" id="answer-'+i+'" onclick="selectPracticeAnswer('+i+')">';
    html+='<span class="answer-letter">'+letters[i]+'</span><span>'+q[2][i]+'</span></button>';
  }
  html+='</div>';
  html+='<div id="feedback-area" style="display:none;margin-top:16px;text-align:center"></div>';
  html+='<div id="aria-tip-area" style="display:none"></div>';
  html+='<div id="next-area" style="display:none;margin-top:16px">';
  html+='<button class="btn btn-primary btn-block" onclick="nextPracticeQuestion()">'+t('next')+'</button></div>';
  html+='<div style="display:flex;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--text-muted)">';
  html+='<span>XP: '+(stats?stats.xp:0)+'</span><span>'+t('streak')+': '+(stats?stats.currentStreak:0)+'</span></div>';
  content.innerHTML=html;
  practiceAnswered=false;
}

function selectPracticeAnswer(idx) {
  if(practiceAnswered) return;
  practiceAnswered=true;
  var q=practiceQuestions[practiceIndex];
  var correctIdx=q[3], isCorrect=(idx===correctIdx), category=q[4];
  stats.totalAnswered++;
  if(!stats.categoryStats[category]) stats.categoryStats[category]={answered:0,correct:0};
  stats.categoryStats[category].answered++;
  var xpGained=0;
  practiceSessionTotal++;
  if(isCorrect){
    stats.totalCorrect++;stats.categoryStats[category].correct++;
    stats.currentStreak++;if(stats.currentStreak>stats.bestStreak) stats.bestStreak=stats.currentStreak;
    xpGained=10;if(stats.currentStreak>=2) xpGained+=5;
    stats.xp+=xpGained;practiceSessionCorrect++;
    addDailyCorrect(1);recordStreakDay();
  } else { stats.currentStreak=0; }
  practiceSessionAnswers.push({questionId:q[0],category:category,correct:isCorrect,selected:idx});
  checkBadges();saveStats();
  var btns=document.querySelectorAll('.answer-btn');
  for(var i=0;i<btns.length;i++){btns[i].classList.add('disabled');if(i===correctIdx) btns[i].classList.add('correct');if(i===idx&&!isCorrect) btns[i].classList.add('wrong');}
  var fb=document.getElementById('feedback-area');fb.style.display='block';
  if(isCorrect){
    fb.innerHTML='<div style="color:var(--green);font-weight:700;font-size:16px">'+t('correct_answer')+'</div>';
    if(xpGained>0){var btn=document.getElementById('answer-'+idx);if(btn){var rect=btn.getBoundingClientRect();showXPFloat(xpGained,rect.left+rect.width/2-30,rect.top-10);}}
  } else {
    fb.innerHTML='<div style="color:var(--red);font-weight:700;font-size:16px">'+t('wrong_answer')+'</div>';
    var tipArea=document.getElementById('aria-tip-area');
    tipArea.style.display='block';
    tipArea.innerHTML='<div class="aria-tip"><div class="aria-header">✨ '+t('aria_says')+'</div><div class="aria-text">'+t(getCategoryTipKey(category))+'</div></div>';
  }
  document.getElementById('next-area').style.display='block';
}

function nextPracticeQuestion() {
  practiceIndex++;
  if(practiceSessionTotal>0&&practiceSessionTotal%10===0){saveSessionAndShowAnalysis('practice');return;}
  renderPracticeQuestion();window.scrollTo(0,0);
}

  html+='<p style="color:var(--text-secondary);font-size:15px;line-height:1.6;margin-bottom:32px">'+t('exam_desc').replace(/\n/g,'<br>')+'</p>';

function startExam() {
  examQuestions=shuffle(questions).slice(0,30);examIndex=0;examAnswered=false;
  examStartTime=Date.now();examTimeLeft=2400;examAnswers=[];
  if(examTimer) clearInterval(examTimer);
  examTimer=setInterval(function(){examTimeLeft--;updateExamTimer();if(examTimeLeft<=0){clearInterval(examTimer);examTimer=null;finishExam();}},1000);
  navigate('exam-active');
}

function renderExamQuestion() {
  currentPage='exam-active';
  if(examIndex>=examQuestions.length){finishExam();return;}
  var q=examQuestions[examIndex];var content=document.getElementById('app-content');
  var num=examIndex+1;var letters=['A','B','C','D'];
  var html='';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  html+='<div class="q-counter">'+t('question')+' '+num+' '+t('of')+' 30</div>';
  var tc='exam-timer';if(examTimeLeft<=300) tc+=' danger';else if(examTimeLeft<=600) tc+=' warning';
  html+='<div class="'+tc+'" id="exam-timer-display">⏱ '+formatTime(examTimeLeft)+'</div></div>';
  html+='<div class="progress-bar" style="margin-bottom:16px"><div class="progress-fill" style="width:'+((num/30)*100)+'%"></div></div>';
  html+='<div class="q-category">'+getCategoryDisplayName(q[4])+'</div>';
  html+='<h3 style="font-size:17px;font-weight:600;line-height:1.6;margin-bottom:20px">'+q[1]+'</h3>';
  html+='<div id="answers-container">';
  for(var i=0;i<q[2].length;i++){
    html+='<button class="answer-btn" id="exam-answer-'+i+'" onclick="selectExamAnswer('+i+')">';
    html+='<span class="answer-letter">'+letters[i]+'</span><span>'+q[2][i]+'</span></button>';
  }
  html+='</div>';
  html+='<div id="exam-next-area" style="display:none;margin-top:16px">';
  html+='<button class="btn btn-primary btn-block" onclick="nextExamQuestion()">'+t('next')+'</button></div>';
  content.innerHTML=html;examAnswered=false;
}

function updateExamTimer() {
  var el=document.getElementById('exam-timer-display');if(!el) return;
  el.textContent='⏱ '+formatTime(examTimeLeft);el.className='exam-timer';
  if(examTimeLeft<=300) el.className+=' danger';else if(examTimeLeft<=600) el.className+=' warning';
}

function selectExamAnswer(idx) {
  if(examAnswered) return;examAnswered=true;
  var q=examQuestions[examIndex];
  examAnswers.push({questionId:q[0],category:q[4],selected:idx,correct:idx===q[3]});
  var btns=document.querySelectorAll('.answer-btn');
  for(var i=0;i<btns.length;i++){btns[i].classList.add('disabled');if(i===idx) btns[i].classList.add('selected');}
  document.getElementById('exam-next-area').style.display='block';
}

function nextExamQuestion() { examIndex++;if(examIndex>=30) finishExam();else{renderExamQuestion();window.scrollTo(0,0);} }

function finishExam() {
  if(examTimer){clearInterval(examTimer);examTimer=null;}
  var correctCount=0,catStats={};
  for(var i=0;i<examAnswers.length;i++){var a=examAnswers[i];if(a.correct) correctCount++;if(!catStats[a.category]) catStats[a.category]={total:0,correct:0};catStats[a.category].total++;if(a.correct) catStats[a.category].correct++;}
  for(var j=0;j<examAnswers.length;j++){var ea=examAnswers[j];stats.totalAnswered++;if(!stats.categoryStats[ea.category]) stats.categoryStats[ea.category]={answered:0,correct:0};stats.categoryStats[ea.category].answered++;if(ea.correct){stats.totalCorrect++;stats.categoryStats[ea.category].correct++;}}
  stats.xp+=correctCount*10;
  if(correctCount===30) awardBadge('perfect');
  addDailyCorrect(correctCount);recordStreakDay();
  var elapsed=Math.round((Date.now()-examStartTime)/1000);
  var session={date:new Date().toISOString(),type:'exam',total:examAnswers.length,correct:correctCount,categories:catStats,score:Math.round((correctCount/examAnswers.length)*100),time:elapsed};
  stats.sessions.unshift(session);if(stats.sessions.length>50) stats.sessions=stats.sessions.slice(0,50);
  checkBadges();saveStats();
  practiceSessionAnswers=examAnswers;practiceSessionCorrect=correctCount;practiceSessionTotal=examAnswers.length;
  renderExamResults();
}

function renderExamResults() {
  currentPage='exam-results';var content=document.getElementById('app-content');
  var session=stats.sessions[0];if(!session){navigate('home');return;}
  var passed=session.correct>=26;
  var elapsed=session.time||0,em=Math.floor(elapsed/60),es=elapsed%60;
  if(passed) setTimeout(launchConfetti,300);
  var html='<div style="text-align:center;padding:20px 0">';
  html+='<div class="result-circle '+(passed?'pass':'fail')+'">';
  html+='<div class="result-score">'+session.correct+'/30</div><div class="result-label">'+session.score+'%</div></div>';
  html+='<h2 style="font-size:24px;font-weight:800;margin-bottom:8px;color:'+(passed?'var(--green)':'var(--red)')+'">'+( passed?t('exam_result_pass'):t('exam_result_fail'))+'</h2>';
  html+='<p style="color:var(--text-secondary);font-size:14px;margin-bottom:24px">'+t('exam_time')+': '+em+' '+t('minutes')+' '+es+' '+t('seconds')+'</p>';
  html+='<div style="display:flex;flex-direction:column;gap:10px;max-width:300px;margin:0 auto">';
  html+='<button class="btn btn-primary btn-block" onclick="navigate(\'analysis\')">'+t('view_analysis')+'</button>';
  if(!passed) html+='<button class="btn btn-secondary btn-block" onclick="navigate(\'exam-setup\')">'+t('try_again')+'</button>';
  html+='<button class="btn btn-secondary btn-block" onclick="navigate(\'home\')">'+t('back_home')+'</button>';
  html+='</div></div>';
  content.innerHTML=html;updateHeader('exam-results');
}

function saveSessionAndShowAnalysis(type) {
  var catStats={};
  for(var i=0;i<practiceSessionAnswers.length;i++){var a=practiceSessionAnswers[i];if(!catStats[a.category]) catStats[a.category]={total:0,correct:0};catStats[a.category].total++;if(a.correct) catStats[a.category].correct++;}
  var session={date:new Date().toISOString(),type:type,total:practiceSessionTotal,correct:practiceSessionCorrect,categories:catStats,score:practiceSessionTotal>0?Math.round((practiceSessionCorrect/practiceSessionTotal)*100):0};
  stats.sessions.unshift(session);if(stats.sessions.length>50) stats.sessions=stats.sessions.slice(0,50);
  saveStats();navigate('analysis');
}

function renderAnalysis() {
  currentPage='analysis';var content=document.getElementById('app-content');
  var session=stats.sessions[0];var isFromExam=(session&&session.type==='exam');

  html+='<div class="analysis-card"><div style="text-align:center;margin-bottom:8px">';

  html+='</div></div>';
  if(weakest&&weakestAcc<100){html+='<div class="analysis-section"><div class="analysis-title">🎯 '+t('weakest_cat')+'</div><div class="analysis-card"><div style="font-size:16px;font-weight:600;margin-bottom:8px">'+getCategoryDisplayName(weakest)+' ('+weakestAcc+'%)</div><p style="color:var(--text-secondary);font-size:14px">'+t('mistakes_in')+' '+getCategoryDisplayName(weakest)+'</p></div></div>';}
  html+='<div class="analysis-section"><div class="analysis-title">💡 '+t('tip_title')+'</div><div class="analysis-tip">';

  html+='</div></div>';
  html+='<div class="analysis-section"><div class="analysis-title">📈 '+t('progress_trend')+'</div><div class="analysis-card">';
  if(stats.sessions.length<=1) html+='<p style="color:var(--text-secondary);font-size:14px">'+t('first_session')+'</p>';
  else{var prev=stats.sessions[1];var diff=session.score-prev.score;var trend=diff>5?t('improving'):diff<-5?t('declining'):t('stable');html+='<div style="font-size:16px;font-weight:600;margin-bottom:8px">'+trend+'</div><p style="color:var(--text-secondary);font-size:14px">'+(lang==='he'?'נוכחי':'Current')+': '+session.score+'% | '+(lang==='he'?'קודם':'Previous')+': '+prev.score+'%';if(diff>0) html+=' <span style="color:var(--green)">(+'+diff+'%)</span>';else if(diff<0) html+=' <span style="color:var(--red)">('+diff+'%)</span>';html+='</p>';
  var rs=stats.sessions.slice(0,5);html+='<div style="display:flex;gap:6px;align-items:flex-end;height:60px;margin-top:16px">';for(var s=rs.length-1;s>=0;s--){var rss=rs[s];var bh=Math.max(10,(rss.score/100)*60);var bc=rss.score>=87?'var(--green)':rss.score>=70?'var(--amber)':'var(--red)';html+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div style="font-size:10px;color:var(--text-muted)">'+rss.score+'%</div><div style="width:100%;height:'+bh+'px;background:'+bc+';border-radius:4px;transition:height .5s"></div></div>';}html+='</div>';}
  html+='</div></div>';
  html+='<div style="display:flex;flex-direction:column;gap:10px;margin-top:24px">';
  if(!isFromExam){html+='<button class="btn btn-primary btn-block" onclick="continuePracticeAfterAnalysis()">'+t('continue_practice')+'</button>';html+='<button class="btn btn-secondary btn-block" onclick="navigate(\'home\')">'+t('stop_practice')+'</button>';}
  else html+='<button class="btn btn-primary btn-block" onclick="navigate(\'home\')">'+t('back_home')+'</button>';
  html+='</div>';
  content.innerHTML=html;updateHeader('analysis');

            <tr><td>דרך מהירה</td><td>110 קמ״ש</td><td>100 קמ״ש</td><td>80 קמ״ש</td></tr>
          </table>
          <div class="study-highlight">⚠️ <strong>חובת האטה:</strong> בקרבת מעברי חצייה, בתי ספר, עקומות חדות, ירידות תלולות, מנהרות, גשרים צרים, תחנות אוטובוס ובקרבת בעלי חיים.</div>

          <p>בצומת ללא תמרורים ורמזורים — זכות הקדימה לרכב המגיע מימין. כללים נוספים:</p>
          <ul>
            <li>הפונה שמאלה ייתן זכות קדימה לרכב הבא ממול</li>
            <li>הנכנס מדרך עפר לדרך סלולה — ייתן זכות קדימה</li>
            <li>היוצא מחצר, חניון או תחנת דלק — ייתן זכות קדימה לכל עוברי הדרך</li>
            <li>במעגל תנועה (כיכר) — זכות קדימה למי שנמצא בתוך הכיכר</li>
            <li>רכב ביטחון עם אור מהבהב ואזעקה — זכות קדימה מוחלטת</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>עקיפה</h4>
          <p>העקיפה תתבצע תמיד מצד שמאל, למעט כשהרכב שלפנים מאותת שמאלה. אסור לעקוף:</p>
          <ul>
            <li>במעבר חצייה או בסמוך אליו</li>
            <li>בצומת או 20 מטר לפניו (אלא אם הדרך בעלת שני נתיבים לכיוון)</li>
            <li>כשהראות מוגבלת (עקומה, פסגת גבעה)</li>
            <li>כשיש קו הפרדה רצוף בצד שלך</li>
            <li>כשרכב אחר עוקף באותו זמן</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>מרחקי עצירה</h4>
          <p>מרחק העצירה = מרחק תגובה + מרחק בלימה. זמן התגובה הממוצע של נהג הוא כ-0.75 עד 1.5 שניות.</p>
          <div class="study-highlight">💡 <strong>כלל אצבע לשמירת מרחק:</strong> לפחות 2 שניות מהרכב שלפנים בדרך יבשה, ו-4 שניות בכביש רטוב. ככל שהמהירות גבוהה יותר — מרחק העצירה גדל משמעותית.</div>
        </div>

        <div class="study-topic">
          <h4>נהג חדש</h4>
          <p>נהג חדש מוגדר כך במשך שנתיים מקבלת הרישיון. ההגבלות:</p>
          <ul>
            <li>חובת נהג מלווה לנהג צעיר (מתחת לגיל 24) — 6 חודשים (3 יום ולילה, 3 בלילה בלבד)</li>
            <li>50 שעות ליווי: 20 בעירוני, 15 בינעירוני, 15 בלילה</li>
            <li>הגבלת נוסעים: עד 2 נוסעים בשנתיים הראשונות (או עד גיל 21)</li>
            <li>נהג מלווה: בן 24+ עם 5 שנות רישיון, או בן 30+ עם 3 שנות רישיון</li>
          </ul>
        </div>

        <button class="study-link-practice" onclick="navigate('practice')">📝 תרגלו שאלות בנושא חוקי תנועה ←</button>
      </div>
    </div>

    <!-- Section 2: תמרורים -->
    <div class="study-section" data-category="signs" id="study-signs">
      <div class="study-section-header" onclick="toggleStudy(this)">
        <span class="study-section-icon">🚦</span>
        <span class="study-section-title">תמרורים</span>
        <span class="study-section-arrow">▼</span>
      </div>
      <div class="study-section-body">

        <div class="study-topic">
          <h4>תמרורי אזהרה (משולש אדום)</h4>
          <p>משולש עם פס אדום — מזהיר על סכנה קרובה. הנהג חייב להאט ולנקוט זהירות:</p>
          <ul>
            <li><strong>עקומה מסוכנת</strong> — האטה לפני הכניסה לעקומה</li>
            <li><strong>צומת מסוכן</strong> — ערנות לרכבים מכיוונים אחרים</li>
            <li><strong>מעבר חצייה</strong> — האטה ומוכנות לעצירה מלאה</li>
            <li><strong>עבודות בדרך</strong> — סימון זמני בצבע כתום</li>
            <li><strong>מפגש מסילת ברזל</strong> — האטה ומוכנות לעצירה, עצירת מנוע אסורה על המסילה</li>
            <li><strong>ירידה תלולה / עלייה תלולה</strong> — שימוש בהילוך נמוך</li>
            <li><strong>דרך חלקה</strong> — הפחתת מהירות, הימנעות מבלימה חדה</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>תמרורי הוראה — איסור (עיגול אדום)</h4>
          <p>עיגול עם מסגרת אדומה — מורה על איסור:</p>
          <ul>
            <li><strong>אין כניסה</strong> — כניסה אסורה לכלי רכב (עיגול אדום מלא)</li>
            <li><strong>תנועה בכיוון אחד</strong> — אסור לנסוע בכיוון ההפוך</li>
            <li><strong>אסור לעקוף</strong> — איסור עקיפה עד לתמרור ביטול</li>
            <li><strong>אסור לחנות</strong> — X אדום כחול: איסור חנייה, 2 קווים אדומים: איסור עצירה וחנייה</li>
            <li><strong>מגבלת מהירות</strong> — המספר בתוך העיגול הוא המהירות המרבית</li>
            <li><strong>אסור לפנות</strong> — שמאלה / ימינה / פרסה (U-turn)</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>תמרורי הוראה — חובה (עיגול כחול)</h4>
          <p>עיגול כחול עם סימון לבן — מחייב פעולה מסוימת:</p>
          <ul>
            <li><strong>כיוון נסיעה חובה</strong> — חץ לבן מציין כיוון מחייב</li>
            <li><strong>מעגל תנועה</strong> — חובה לנסוע בכיוון החצים (נגד כיוון השעון)</li>
            <li><strong>שביל אופניים חובה</strong> — רוכבי אופניים חייבים לנסוע בשביל</li>
            <li><strong>שרשראות שלג</strong> — חובת שימוש בשרשראות</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>תמרורי הודעה ואינפורמציה (מלבן/ריבוע)</h4>
          <p>מספקים מידע לנהג — לא מחייבים ולא אוסרים:</p>
          <ul>
            <li><strong>ירוק</strong> — כיוונים ויעדים בדרכים בינעירוניות</li>
            <li><strong>כחול</strong> — מידע בדרך עירונית (חניון, בית חולים)</li>
            <li><strong>חום</strong> — אתרי תיירות ופנאי</li>
            <li><strong>כניסה/יציאה מעיר</strong> — תמרור כניסה לשטח עירוני (מהירות 50 קמ״ש) ויציאה</li>
            <li><strong>דרך מהירה</strong> — תמרור ירוק עם סמל מכונית</li>
            <li><strong>דרך חד סטרית</strong> — חץ לבן על רקע כחול</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>רמזורים</h4>
          <ul>
            <li><strong>אדום</strong> — עצירה מוחלטת מאחורי קו העצירה</li>
            <li><strong>אדום + צהוב</strong> — הכנה לנסיעה, אך עדיין אסור לנוע</li>
            <li><strong>ירוק</strong> — מותר לנסוע, בתנאי שהצומת פנוי</li>
            <li><strong>ירוק מהבהב</strong> — עומד להשתנות לצהוב — התכונן לעצור</li>
            <li><strong>צהוב</strong> — עצור, אלא אם אתה קרוב מדי ולא ניתן לעצור בבטחה</li>
            <li><strong>צהוב מהבהב</strong> — נהג בזהירות, הצומת לא מוסדר</li>
            <li><strong>חץ ירוק</strong> — מותר לנסוע בכיוון החץ בלבד</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>סימוני כביש</h4>
          <ul>
            <li><strong>קו לבן רצוף</strong> — אסור לחצות (אסור לעקוף)</li>
            <li><strong>קו לבן מקווקו</strong> — מותר לחצות (מותר לעקוף בזהירות)</li>
            <li><strong>קו כפול רצוף</strong> — איסור חציה משני הצדדים</li>
            <li><strong>קו רצוף + מקווקו</strong> — מותר לחצות רק מצד הקו המקווקו</li>
            <li><strong>פסי חציה (זברה)</strong> — זכות קדימה להולכי רגל</li>
            <li><strong>משולש לבן על הכביש</strong> — תן זכות קדימה</li>
          </ul>
        </div>

    <div class="study-section" data-category="safety" id="study-safety">
      <div class="study-section-header" onclick="toggleStudy(this)">

      <div class="study-section-body">

        <div class="study-topic">
          <h4>חגורת בטיחות וילדים ברכב</h4>
          <p>החוק מחייב חגורת בטיחות לכל נוהג ונוסע. מספר הנוסעים מוגבל למספר החגורות:</p>
          <ul>
            <li><strong>תינוק עד שנה</strong> — מושב בטיחות הפוך לכיוון הנסיעה</li>
            <li><strong>ילד עד גיל 3</strong> — מושב בטיחות מתאים לגובה ומשקל</li>
            <li><strong>ילד עד גיל 8</strong> — מושב מגביה (בוסטר) או מושב בטיחות</li>
            <li><strong>מגיל 8 ומעלה</strong> — חגורת בטיחות רגילה</li>
          </ul>
          <div class="study-highlight">⚠️ <strong>פטור מחגורה:</strong> נסיעה לאחור, נהג מונית בדרך עירונית (עם נוסעים), חולה עם אישור רפואי.</div>
        </div>

        <div class="study-topic">
          <h4>6 עקרונות הנהיגה הבטיחותית</h4>
          <ul>
            <li><strong>עקרון הבולטות</strong> — להיות נראה לאחרים (תאורה, ביגוד בולט בלילה)</li>
            <li><strong>עקרון הצפיות</strong> — לצפות מראש מצבים מסוכנים ולהתכונן</li>
            <li><strong>עקרון הנראות</strong> — לראות ולהיראות: מראות, שמשות נקיות, פנסים תקינים</li>
            <li><strong>עקרון התקשורת</strong> — לתקשר עם שאר עוברי הדרך (איתות, אורות, קשר עין)</li>
            <li><strong>עקרון הזהירות</strong> — לנהוג בזהירות ולהימנע מסיכונים מיותרים</li>
            <li><strong>עקרון הבריאות והכשירות</strong> — לוודא כשירות גופנית ונפשית לנהיגה</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>נהיגה בלילה</h4>
          <p>נהיגה בחשכה מגבירה סכנה בשל עייפות וקושי בראייה:</p>
          <ul>
            <li><strong>אור גבוה</strong> — מאיר 100 מטר, מופעל בחשכה כשאין רכב ממול</li>
            <li><strong>אור נמוך (חזית)</strong> — מאיר 30 מטר, כשיש רכב ממול או מאחור</li>
            <li>רכב פרטי — חובת הדלקת אורות מחוץ לעיר מ-1 בנובמבר עד 31 במרץ</li>
            <li>משאיות, אוטובוסים ומוניות — חובת אורות בכל עונות השנה</li>
            <li>למנוע סנוור: שמשות נקיות, הסטת מבט ימינה, התאמת מהירות</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>נהיגה בתנאי מזג אוויר</h4>
          <ul>
            <li><strong>גשם</strong> — הפחתת מהירות, הגדלת מרחק, סכנת אקווה-פלנינג (החלקה על מים)</li>
            <li><strong>ערפל</strong> — שימוש באורות ערפל, מהירות נמוכה, מרחק מוגדל</li>
            <li><strong>שמש מסנוורת</strong> — שימוש במגן שמש, משקפי שמש, האטה</li>
            <li><strong>רוח חזקה</strong> — אחיזה חזקה בהגה, זהירות מוגברת בגשרים ובשטחים פתוחים</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>הסחת דעת בנהיגה</h4>
          <p>הסחת דעת היא גורם מרכזי לתאונות. על הנהג להימנע מ:</p>
          <ul>
            <li>שימוש בטלפון נייד (גם לא בדיבורית ידנית) — רק בדיבורית קבועה</li>
            <li>אכילה ושתייה בזמן נהיגה</li>
            <li>טיפול בילדים או בנוסעים תוך כדי נהיגה</li>
            <li>תכנות מכשיר ניווט בזמן נסיעה</li>
          </ul>
          <div class="study-highlight">⚠️ <strong>לחץ חברתי:</strong> נהגים צעירים מושפעים מנוסעים בני גילם. ככל שמספר הנוסעים הצעירים גדל — הסיכון לתאונה עולה.</div>
        </div>

        <div class="study-topic">
          <h4>תאונת דרכים — חובות הנהג</h4>
          <ul>
            <li>לעצור מיד ולגשת לעזור לנפגעים</li>
            <li>לזעוק לשירותי הצלה: אמבולנס, משטרה, כיבוי אש</li>
            <li>למסור פרטים אישיים לשוטר ולמעורבים</li>
            <li>לא להזיז את הרכב לפני תיעוד (אלא לצורך פינוי נפגע)</li>
            <li>לשמור מרחק 100 מטר מרכב ביטחון בכביש</li>
          </ul>
        </div>

    <!-- Section 4: הכרת הרכב -->
    <div class="study-section" data-category="vehicle" id="study-vehicle">
      <div class="study-section-header" onclick="toggleStudy(this)">

      <div class="study-section-body">

        <div class="study-topic">
          <h4>מערכות הרכב</h4>
          <ul>
            <li><strong>מערכת האצה</strong> — דוושת הגז מכניסה אוויר לתא הבעירה; לחיצה חזקה = האצה</li>
            <li><strong>מערכת בלימה</strong> — רפידות נצמדות לדיסק הגלגל ויוצרות חיכוך; בלם חנייה פועל על ציר אחד בלבד</li>
            <li><strong>מערכת הילוכים</strong> — הילוך גבוה לנסיעה, הילוך נמוך לבלימת מנוע בירידות</li>
            <li><strong>מערכת היגוי</strong> — הגה שמחובר לגלגלים, כוח ההיגוי גובר כשהרכב נע לאט</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>בדיקות לפני נסיעה (יומיות)</h4>
          <ul>
            <li><strong>צמיגים</strong> — בדיקת לחץ אוויר לפי הוראות היצרן. לחץ נמוך מגביר צריכת דלק וסכנת התפוצצות</li>
            <li><strong>פנסים</strong> — פנס שבור מסכן — לא מאיר כראוי ועלול לסנוור</li>
            <li><strong>נוזלים</strong> — מים לקירור, מים למגבים, שמן מנוע (בדיקה כשהרכב מדומם במישור)</li>
            <li><strong>מגבים ושמשות</strong> — מגב פגום עלול לגרום נזק לשמשה ולהפחית ראות</li>
            <li><strong>מראות</strong> — כיוון מראות לפני תחילת נסיעה</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>צמיגים</h4>
          <p>הצמיגים הם נקודת המגע היחידה בין הרכב לכביש:</p>
          <ul>
            <li><strong>לחץ נמוך</strong> — שחיקה לא אחידה, צריכת דלק מוגברת, סכנת התפוצצות, פגיעה בשליטה</li>
            <li><strong>לחץ גבוה</strong> — שחיקה באמצע הצמיג, תחושת קשיחות, הרס מואץ</li>
            <li>יש לבדוק לחץ אוויר כשהצמיג קר (לפני נסיעה)</li>
            <li>עומק מינימלי של חריצי הצמיג — 1.6 מ״מ</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>מערכות בטיחות</h4>
          <ul>
            <li><strong>ABS</strong> — מערכת נגד נעילת גלגלים; מאפשרת בלימה ושליטה בהיגוי בו-זמנית</li>
            <li><strong>כריות אוויר (Airbag)</strong> — בטיחות פאסיבית; מתנפחות בעת פגיעה להגנה על הנוסעים</li>
            <li><strong>חגורת בטיחות</strong> — בטיחות פאסיבית; מונעת מהנוסע להיזרק קדימה</li>
            <li><strong>ESP</strong> — בקרת יציבות אלקטרונית; מונעת החלקה וסחרור</li>
          </ul>
          <div class="study-highlight">💡 <strong>בטיחות אקטיבית</strong> = מערכות שמונעות תאונה (ABS, ESP). <strong>בטיחות פאסיבית</strong> = מערכות שמפחיתות פגיעה בתאונה (כריות אוויר, חגורות, פגוש).</div>
        </div>

        <div class="study-topic">
          <h4>תחזוקה שוטפת</h4>
          <ul>
            <li>טיפולים לפי הוראות יצרן — מפחיתים צריכת דלק וזיהום אוויר</li>
            <li>טסט שנתי — כולל בדיקת זיהום אוויר</li>
            <li>אסור לנסוע כשגזים שרופים חודרים לתא הנוסעים</li>
            <li>אסור להשאיר מנוע דולק בחניון תת-קרקעי — גזים רעילים</li>
            <li>נורת אזהרה בלוח מכוונים = עצור ובדוק מיד</li>
          </ul>
        </div>

      <div class="study-section-body">

        <div class="study-topic">
          <h4>חנייה, עצירה ועמידה</h4>
          <ul>
            <li><strong>חנייה</strong> — העמדת רכב לזמן קצוב, לא לשם הורדת/העלאת נוסעים</li>
            <li><strong>עצירה</strong> — עצירה לשם פריקה/טעינה או הורדה/העלאה של נוסעים</li>
            <li>המרחק מקצה הכביש — לא יותר מ-40 ס״מ</li>
            <li>חובה לכבות מנוע, להוציא מפתח ולהפעיל בלם חנייה</li>
            <li><strong>במורד</strong> — לכוון גלגלים לשפת הכביש</li>
            <li><strong>במעלה</strong> — לכוון גלגלים הרחק מהשפה</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>איסורי חנייה</h4>
          <ul>
            <li>20 מטר לפני ואחרי תחנת אוטובוס, 12 מטר ממולה</li>
            <li>20 מטר לפני ואחרי מסילת ברזל</li>
            <li>12 מטר לפני ואחרי צומת</li>
            <li>על מדרכה (אלא לצורך כניסה/יציאה מחצר)</li>
            <li>בדרך שאינה עירונית — אסור לחנות (מותר רק הורדת/העלאת נוסעים)</li>
            <li>בדרך מהירה — אסור לחנות או לעצור כלל</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>מעגל תנועה (כיכר)</h4>
          <ul>
            <li>כיוון הנסיעה — נגד כיוון השעון (ימינה)</li>
            <li>זכות קדימה — למי שנמצא בתוך הכיכר</li>
            <li>איתות — איתות ימינה ביציאה מהכיכר</li>
            <li>אם צריך לצאת ביציאה הראשונה — להיצמד לנתיב הימני</li>
            <li>אם צריך לצאת ביציאה רחוקה — להיכנס מנתיב שמאלי</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>נסיעה בדרכים בינעירוניות</h4>
          <ul>
            <li>מהירות מותרת 80 קמ״ש (90 עם הפרדה, 110 בדרך מהירה)</li>
            <li>שמירת מרחק גדול מהרכב שלפנים</li>
            <li>הילוך נמוך בירידות תלולות — לא להסתמך רק על בלמים</li>
            <li>בדרך הררית — רכב יורד נותן זכות קדימה לרכב עולה (כשהדרך צרה)</li>
            <li>ירידה לשול — להאט, לרדת בזווית הדרגתית, לחזור רק כשהדרך פנויה והשול באותו גובה</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>החלקה ומצבי חירום</h4>
          <ul>
            <li><strong>סיבות להחלקה:</strong> מים, חצץ, בוץ (חוסר מגע צמיג-כביש) או שימוש מופרז בבלמים</li>
            <li><strong>אקווה-פלנינג:</strong> שכבת מים בין הצמיג לכביש — יש להאט ולא לבלום בחדות</li>
            <li><strong>תקר</strong> — אחיזה חזקה בהגה, האטה הדרגתית, ירידה לשול</li>
            <li><strong>כשל בלמים</strong> — שימוש בבלם חנייה בהדרגה, שילוב הילוך נמוך</li>
            <li><strong>פנסי מצוקה</strong> — להפעיל בעת תקלה או סכנה, סימון עם משולש אזהרה</li>
          </ul>
        </div>

        <div class="study-topic">
          <h4>נסיעה לאחור</h4>
          <p>נסיעה לאחור מסוכנת מאוד בגלל שדה ראייה מצומצם ושטחים מתים. מותרת רק כשאין חלופה, ויש לבצע בזהירות רבה. בזמן נסיעה לאחור — הנהג פטור מחגורת בטיחות.</p>
        </div>

        <div class="study-topic">
          <h4>הדרך וחלקיה — הגדרות חשובות</h4>
          <ul>
            <li><strong>דרך</strong> — כל מסילה, רחוב, סמטה, כיכר, גשר שלציבור זכות לעבור בו</li>
            <li><strong>כביש</strong> — חלק מהדרך המיועד לנסיעת כלי רכב (ללא שול)</li>
            <li><strong>מדרכה</strong> — להולכי רגל בלבד; אסור לחנות עליה</li>
            <li><strong>שול דרך</strong> — שטח בין הכביש למעקה/שוליים</li>
            <li><strong>צומת</strong> — שטח שנוצר ממפגש שני כבישים או יותר</li>
            <li><strong>כביש חד-סטרי</strong> — תנועה בכיוון אחד בלבד</li>
          </ul>

}

function toggleStudy(el){
  el.classList.toggle('open');
  var body=el.nextElementSibling;
  body.classList.toggle('open');
}

function initStudyGuideEvents(){
  document.querySelectorAll('#app-content .study-nav-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('#app-content .study-nav-btn').forEach(function(b){b.classList.remove('active')});
      btn.classList.add('active');
      var cat=btn.getAttribute('data-study');
      document.querySelectorAll('#app-content .study-section').forEach(function(s){
        s.style.display=(cat==='all'||s.getAttribute('data-category')===cat)?'':'none';
      });
    });
  });
}

/* ============================================================
   INITIALIZATION
   ============================================================ */
function init() {
  try{var sl=localStorage.getItem(STORAGE_KEYS.lang);if(sl==='en'||sl==='he') lang=sl;}catch(e){}
  try{var lt=localStorage.getItem(STORAGE_KEYS.license);if(lt) licenseType=lt;}catch(e){}
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==='he')?'rtl':'ltr';
  document.getElementById('lang-toggle').textContent=(lang==='he')?'EN':'עב';
  var labels=document.querySelectorAll('.nav-label');
  for(var i=0;i<labels.length;i++){var k=labels[i].getAttribute('data-t');if(k) labels[i].textContent=t(k);}
  document.getElementById('loading-title').textContent=t('app_title');
  document.getElementById('loading-text').textContent=lang==='he'?'טוען שאלות...':'Loading questions...';
  loadStats();
  fetchQuestions();
}
init();
</script>
